<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員新規登録 | 管理者ポータル</title>
    <link rel="icon" type="image/png" href="./CIDMchara.png">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: radial-gradient(1200px 500px at 20% -10%, #dbeafe 0%, transparent 60%), radial-gradient(900px 400px at 85% -5%, #e0e7ff 0%, transparent 55%), #eef2f7; font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; display: flex; flex-direction: column; color: #1e293b; }
        .admin-header { display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; height:72px; background:rgba(255,255,255,.78); backdrop-filter:blur(8px); border-bottom:1px solid #dbe4ef; position:sticky; top:0; z-index:10; box-shadow:0 1px 8px rgba(15,23,42,.06); }
        .brand { display:flex; align-items:center; gap:.75rem; text-decoration:none; }
        .brand-icon { width:38px; height:38px; background:linear-gradient(135deg,#2563eb,#0ea5e9); border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1rem; }
        .brand-text { font-size:.78rem; font-weight:700; color:#64748b; letter-spacing:.1em; text-transform:uppercase; }
        .brand-text span { display:block; color:#1e293b; font-size:.9rem; letter-spacing:.04em; }
        .header-back { display:inline-flex; align-items:center; gap:.4rem; color:#475569; text-decoration:none; font-size:.76rem; font-weight:700; letter-spacing:.06em; border:1px solid #bfdbfe; background:#eff6ff; border-radius:9999px; padding:.35rem .95rem; transition:color .15s,border-color .15s,background .15s; }
        .header-back:hover { color:#1d4ed8; border-color:#93c5fd; background:#dbeafe; }
        .admin-body { flex:1; padding:2.25rem 1.2rem 4rem; max-width:760px; margin:0 auto; width:100%; }
        .form-card { background:#fff; border:1px solid #dbe4ef; border-radius:1rem; padding:2rem 2.2rem; box-shadow:0 1px 6px rgba(15,23,42,.08); }
        .form-heading { margin-bottom:1.8rem; padding-bottom:1.4rem; border-bottom:1px solid #e2e8f0; }
        .form-heading .eyebrow { font-size:.7rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#3b82f6; margin-bottom:.35rem; }
        .form-heading h1 { font-size:1.5rem; font-weight:700; color:#1e293b; display:flex; align-items:center; gap:.5rem; }
        .form-section { margin-bottom:1.8rem; padding-bottom:1.8rem; border-bottom:1px solid #e2e8f0; }
        .form-section:last-of-type { border-bottom:none; margin-bottom:0; }
        .section-label { font-size:.7rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#3b82f6; margin-bottom:1rem; }
        .form-group { margin-bottom:1.15rem; }
        label { display:block; font-size:.78rem; font-weight:700; color:#64748b; letter-spacing:.07em; text-transform:uppercase; margin-bottom:.45rem; }
        input, textarea, select { width:100%; padding:.72rem .9rem; border-radius:.6rem; border:1px solid #cbd5e1; background:#f8fbff; color:#1e293b; font-size:.92rem; font-family:inherit; transition:border-color .15s, box-shadow .15s; outline:none; }
        input:focus, textarea:focus, select:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
        textarea { min-height:80px; resize:vertical; }
        .form-actions { display:flex; justify-content:flex-end; gap:.75rem; margin-top:1.8rem; padding-top:1.4rem; border-top:1px solid #e2e8f0; }
        .btn { padding:.6rem 1.4rem; border-radius:.6rem; font-size:.84rem; font-weight:700; cursor:pointer; transition:opacity .15s, transform .12s; display:inline-flex; align-items:center; gap:.35rem; border:none; }
        .btn:hover { transform:translateY(-1px); }
        .btn-submit { background:linear-gradient(135deg,#2563eb,#0ea5e9); color:#fff; box-shadow:0 8px 18px rgba(37,99,235,.2); }
        .btn-submit:hover { opacity:.88; }
        .btn-cancel { background:#eff6ff; color:#475569; border:1px solid #bfdbfe; }
        .btn-cancel:hover { background:#dbeafe; color:#1d4ed8; border-color:#93c5fd; }
        .admin-footer { text-align:center; padding:1.25rem; font-size:.68rem; color:#64748b; letter-spacing:.08em; text-transform:uppercase; border-top:1px solid #e2e8f0; }
        .contact-row { background:#f8fbff; border:1px solid #dbe4ef; border-radius:.75rem; padding:1rem 1rem .5rem; margin-bottom:.85rem; }
        .contact-row-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:.85rem; }
        .contact-row-num { font-size:.68rem; font-weight:700; color:#3b82f6; letter-spacing:.12em; text-transform:uppercase; }
        .contact-fields { display:grid; grid-template-columns:1fr 1fr; gap:0 1rem; }
        .contact-fields .form-group { margin-bottom:.9rem; }
        .contact-fields .form-group.full { grid-column:1 / -1; }
        .contact-del-btn { background:#fee2e2; border:1px solid #fca5a5; color:#b91c1c; border-radius:.4rem; padding:.22rem .65rem; font-size:.72rem; font-weight:700; cursor:pointer; }
        .contact-primary-label, .cidm-contact-label { display:inline-flex; align-items:center; gap:.4rem; font-size:.75rem; color:#64748b; cursor:pointer; }
        .contact-primary-label input[type=radio] { accent-color:#3b82f6; }
        .cidm-contact-label input[type=radio] { accent-color:#0ea5e9; }
        .contact-add-btn { display:flex; align-items:center; justify-content:center; gap:.4rem; width:100%; background:#eff6ff; border:1px dashed #93c5fd; color:#1d4ed8; padding:.55rem 1rem; border-radius:.6rem; font-size:.8rem; font-weight:700; cursor:pointer; transition:background .15s,border-color .15s; }
        .contact-add-btn:hover { background:#dbeafe; border-color:#60a5fa; }
        .officer-check-wrap { margin:-.2rem 0 1.05rem; }
        .officer-check-label { display:flex; align-items:flex-start; gap:.6rem; text-transform:none; letter-spacing:0; font-size:.95rem; color:#1e293b; margin-bottom:0; cursor:pointer; }
        .officer-check-label input[type=checkbox] { width:1rem; height:1rem; margin-top:.15rem; accent-color:#2563eb; flex:0 0 auto; }
        .officer-check-title { font-weight:700; }
        .officer-check-help { display:block; margin-top:.15rem; color:#64748b; font-size:.78rem; line-height:1.5; }
        .contact-invite-bar { display:flex; align-items:center; gap:.6rem; margin-top:.5rem; padding-top:.6rem; border-top:1px dashed #e2e8f0; flex-wrap:wrap; }
        .btn-invite { display:inline-flex; align-items:center; gap:.35rem; background:#eff6ff; border:1px solid #93c5fd; color:#1d4ed8; border-radius:.5rem; padding:.3rem .8rem; font-size:.76rem; font-weight:700; cursor:pointer; }
        .btn-invite:hover { background:#dbeafe; }
        .btn-invite:disabled { opacity:.5; cursor:not-allowed; }
        .invite-status { font-size:.74rem; color:#64748b; }
        .invite-status.sent { color:#16a34a; }
        .invite-status.error { color:#dc2626; }
        .info-note { font-size:.78rem; color:#64748b; margin-bottom:1rem; line-height:1.7; }
    </style>
</head>
<body>
    <header class="admin-header">
        <a href="admin-portal.html" class="brand">
            <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="brand-text">CIDM <span>管理者ポータル</span></div>
        </a>
        <a href="admin-member-list.html" class="header-back" id="header-back-link"><i class="fa-solid fa-chevron-left"></i> 会員一覧へ戻る</a>
    </header>

    <div class="admin-body">
        <div class="form-card">
            <div class="form-heading">
                <p class="eyebrow">Member Management</p>
                <h1 id="form-title"><i class="fa-solid fa-user-plus"></i> 会員新規登録</h1>
            </div>
            <form id="member-form" autocomplete="off">
                <div class="form-section">
                    <p class="section-label"><i class="fa-solid fa-building"></i> 会社情報</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 1rem;">
                        <div class="form-group">
                            <label for="division_flag">区分</label>
                            <select id="division_flag" name="division_flag">
                                <option value="会員">会員</option>
                                <option value="関係者">関係者</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="member_type">会員種別</label>
                            <select id="member_type" name="member_type">
                                <option value="">-- 未設定 --</option>
                                <option value="正会員">正会員</option>
                                <option value="準会員">準会員</option>
                                <option value="賛助">賛助会員</option>
                            </select>
                        </div>
                    </div>
                    <div class="officer-check-wrap">
                        <label for="is_officer" class="officer-check-label">
                            <input type="checkbox" id="is_officer" name="is_officer">
                            <span>
                                <span class="officer-check-title">この会員を役員として扱う</span>
                                <span class="officer-check-help">理事長・副理事長・理事・監事などの役員に該当する場合にチェックしてください。</span>
                            </span>
                        </label>
                    </div>
                    <div class="form-group"><label for="cidm_role">CIDM役職</label><input type="text" id="cidm_role" name="cidm_role" placeholder="副理事長, 理事, 監事 等"></div>
                    <div class="form-group"><label for="company_name">会社名 <span style="color:#f87171">*</span></label><input type="text" id="company_name" name="company_name" required></div>
                    <div class="form-group"><label for="representative_name">代表者名 <span style="color:#f87171">*</span></label><input type="text" id="representative_name" name="representative_name" required></div>
                    <div class="form-group"><label for="zip_code">郵便番号</label><input type="text" id="zip_code" name="zip_code" placeholder="000-0000"></div>
                    <div class="form-group"><label for="address">住所</label><input type="text" id="address" name="address"></div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 1rem;">
                        <div class="form-group"><label for="phone_number">電話番号</label><input type="text" id="phone_number" name="phone_number" placeholder="03-0000-0000"></div>
                        <div class="form-group"><label for="fax_number">FAX番号</label><input type="text" id="fax_number" name="fax_number" placeholder="03-0000-0000"></div>
                    </div>
                </div>

                <div class="form-section">
                    <p class="section-label"><i class="fa-solid fa-users"></i> 担当者情報</p>
                    <p class="info-note">担当者のメールアドレスがログインIDになります。保存後に「招待メールを送信」を押すと、担当者本人がパスワードを設定できます。</p>
                    <div id="contacts-list"></div>
                    <button type="button" id="add-contact-btn" class="contact-add-btn"><i class="fa-solid fa-plus"></i> 担当者を追加</button>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn btn-cancel">キャンセル</button>
                    <button type="submit" class="btn btn-submit">登録</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./cidm-config.js"></script>
    <script src="./admin-auth.js"></script>
    <script src="./admin-ui.js"></script>
    <script>
    const supabaseClient = window.cidmAdminAuth.createSupabaseClient();
    const form = document.getElementById('member-form');
    const cancelBtn = document.getElementById('cancel-btn');
    const submitBtn = form.querySelector('.btn-submit');
    const headerBackLink = document.getElementById('header-back-link');
    const formTitle = document.getElementById('form-title');
    const contactsList = document.getElementById('contacts-list');
    const addContactBtn = document.getElementById('add-contact-btn');
    const memberId = new URLSearchParams(window.location.search).get('id');
    const isEditMode = !!memberId;
    let contactIndex = 0;

    function setPageMode() {
        document.title = isEditMode ? '会員編集 | 管理者ポータル' : '会員新規登録 | 管理者ポータル';
        formTitle.innerHTML = isEditMode
            ? '<i class="fa-solid fa-user-pen"></i> 会員編集'
            : '<i class="fa-solid fa-user-plus"></i> 会員新規登録';
        submitBtn.textContent = isEditMode ? '更新' : '登録';
        headerBackLink.href = isEditMode ? `admin-members.html?id=${memberId}` : 'admin-member-list.html';
        headerBackLink.innerHTML = isEditMode
            ? '<i class="fa-solid fa-chevron-left"></i> 会員詳細へ戻る'
            : '<i class="fa-solid fa-chevron-left"></i> 会員一覧へ戻る';
    }

    function renumberContacts() {
        [...contactsList.children].forEach((row, i) => {
            row.querySelector('.contact-row-num').textContent = `担当者 ${i + 1}`;
        });
    }

    function createInviteButtonHandler(row) {
        const inviteBtn = row.querySelector('[data-invite-btn]');
        const inviteStatus = row.querySelector('[data-invite-status]');
        const emailInput = row.querySelector('input[name="contact_email[]"]');

        function refreshState() {
            inviteBtn.disabled = !(row.dataset.contactId && emailInput.value.trim());
        }

        emailInput.addEventListener('input', refreshState);
        refreshState();

        inviteBtn.addEventListener('click', async () => {
            const contactId = row.dataset.contactId;
            if (!contactId) {
                window.cidmAdminUi.showToast('先に保存してから招待メールを送信してください。', 'error', 2400);
                return;
            }
            inviteStatus.textContent = '送信中...';
            inviteStatus.className = 'invite-status';
            inviteBtn.disabled = true;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const response = await fetch('https://uhhhifbotqidqeceqyis.supabase.co/functions/v1/member-password-reset', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session?.access_token || ''}`
                    },
                    body: JSON.stringify({ action: 'invite', contact_id: contactId })
                });
                const result = await response.json();
                if (!response.ok || !result.ok) throw new Error(result.error || '送信に失敗しました');
                inviteStatus.textContent = '招待メールを送信しました';
                inviteStatus.className = 'invite-status sent';
            } catch (error) {
                inviteStatus.textContent = error?.message || '送信エラー';
                inviteStatus.className = 'invite-status error';
                refreshState();
            }
        });
    }

    function addContactRow(contact = {}) {
        const idx = contactIndex++;
        const row = document.createElement('div');
        row.className = 'contact-row';
        row.dataset.idx = idx;
        if (contact.id) row.dataset.contactId = contact.id;
        row.innerHTML = `
            <div class="contact-row-header">
                <span class="contact-row-num">担当者 ${contactsList.children.length + 1}</span>
                <div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;">
                    <label class="contact-primary-label"><input type="radio" name="primary_contact" value="${idx}" ${contact.is_primary ? 'checked' : ''}> 主担当者</label>
                    <label class="cidm-contact-label"><input type="radio" name="cidm_contact" value="${idx}" ${contact.is_cidm_contact ? 'checked' : ''}> CIDM担当者</label>
                    <button type="button" class="contact-del-btn" title="削除"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>
            <div class="contact-fields">
                <div class="form-group"><label>部署</label><input type="text" name="contact_department[]" value="${contact.department || ''}"></div>
                <div class="form-group"><label>役職</label><input type="text" name="contact_job_title[]" value="${contact.job_title || ''}"></div>
                <div class="form-group full"><label>担当者名</label><input type="text" name="contact_name[]" value="${contact.name || ''}" placeholder="山田 太郎"></div>
                <div class="form-group full"><label>メールアドレス</label><input type="email" name="contact_email[]" value="${contact.email || ''}" placeholder="staff@example.com"></div>
                <div class="form-group"><label>携帯電話番号</label><input type="text" name="contact_phone[]" value="${contact.phone || ''}" placeholder="090-0000-0000"></div>
                <div class="form-group"><label>電話番号（直通）</label><input type="text" name="contact_phone_direct[]" value="${contact.phone_direct || ''}" placeholder="03-0000-0000"></div>
                <div class="form-group full"><label style="text-transform:none;letter-spacing:0;"><input type="checkbox" name="contact_receive_invite[]" ${contact.receive_invite_mail === false ? '' : 'checked'}> 会議案内メールの送信対象に含める</label></div>
                <div class="form-group full"><label style="text-transform:none;letter-spacing:0;"><input type="checkbox" name="contact_receive_invoice[]" ${contact.receive_invoice_mail === false ? '' : 'checked'}> 会費請求メールの送信対象に含める</label></div>
                <div class="form-group full"><label>備考</label><textarea name="contact_biko[]">${contact.biko || ''}</textarea></div>
            </div>
            <div class="contact-invite-bar">
                <button type="button" class="btn-invite" data-invite-btn><i class="fa-solid fa-envelope"></i> 招待メールを送信</button>
                <span class="invite-status" data-invite-status></span>
            </div>
        `;
        row.querySelector('.contact-del-btn').addEventListener('click', () => {
            if (contactsList.children.length <= 1) return;
            const wasPrimary = row.querySelector('input[name="primary_contact"]').checked;
            const wasCidm = row.querySelector('input[name="cidm_contact"]').checked;
            row.remove();
            renumberContacts();
            if (wasPrimary && contactsList.children.length > 0) {
                contactsList.children[0].querySelector('input[name="primary_contact"]').checked = true;
            }
            if (wasCidm && contactsList.children.length > 0) {
                contactsList.children[0].querySelector('input[name="cidm_contact"]').checked = true;
            }
        });
        createInviteButtonHandler(row);
        contactsList.appendChild(row);
    }

    function collectContacts() {
        const primaryIdx = parseInt(form.querySelector('input[name="primary_contact"]:checked')?.value ?? '-1', 10);
        const cidmIdx = parseInt(form.querySelector('input[name="cidm_contact"]:checked')?.value ?? '-1', 10);
        return [...contactsList.querySelectorAll('.contact-row')].map((row, sortOrder) => ({
            department: row.querySelector('input[name="contact_department[]"]').value.trim() || null,
            job_title: row.querySelector('input[name="contact_job_title[]"]').value.trim() || null,
            name: row.querySelector('input[name="contact_name[]"]').value.trim() || null,
            email: row.querySelector('input[name="contact_email[]"]').value.trim() || null,
            phone: row.querySelector('input[name="contact_phone[]"]').value.trim() || null,
            phone_direct: row.querySelector('input[name="contact_phone_direct[]"]').value.trim() || null,
            receive_invite_mail: row.querySelector('input[name="contact_receive_invite[]"]').checked,
            receive_invoice_mail: row.querySelector('input[name="contact_receive_invoice[]"]').checked,
            biko: row.querySelector('textarea[name="contact_biko[]"]').value.trim() || null,
            is_primary: parseInt(row.dataset.idx, 10) === primaryIdx,
            is_cidm_contact: parseInt(row.dataset.idx, 10) === cidmIdx,
            sort_order: sortOrder
        })).filter((contact) => contact.name || contact.email || contact.department || contact.job_title || contact.phone || contact.phone_direct || contact.biko);
    }

    async function loadEditData() {
        const { data, error } = await supabaseClient.from('member').select('*').eq('id', memberId).single();
        if (error || !data) {
            window.cidmAdminUi.showToast('データ取得に失敗しました。', 'error', 3000);
            form.style.display = 'none';
            return;
        }
        form.division_flag.value = data.division_flag || '会員';
        form.member_type.value = data.member_type || '';
        form.is_officer.checked = Boolean(data.is_officer);
        form.cidm_role.value = data.cidm_role || '';
        form.company_name.value = data.company_name || '';
        form.representative_name.value = data.representative_name || '';
        form.zip_code.value = data.zip_code || '';
        form.address.value = data.address || '';
        form.phone_number.value = data.phone_number || '';
        form.fax_number.value = data.fax_number || '';

        const { data: contacts } = await supabaseClient
            .from('member_contacts')
            .select('id, department, job_title, name, email, phone, phone_direct, receive_invite_mail, receive_invoice_mail, biko, is_primary, is_cidm_contact, sort_order')
            .eq('member_id', memberId)
            .order('sort_order', { ascending: true });

        contactsList.innerHTML = '';
        contactIndex = 0;
        if (Array.isArray(contacts) && contacts.length > 0) {
            contacts.forEach((contact) => addContactRow(contact));
        } else {
            addContactRow({ is_primary: true, is_cidm_contact: true });
        }
        if (!form.querySelector('input[name="primary_contact"]:checked') && contactsList.children.length > 0) {
            contactsList.children[0].querySelector('input[name="primary_contact"]').checked = true;
        }
        if (!form.querySelector('input[name="cidm_contact"]:checked') && contactsList.children.length > 0) {
            contactsList.children[0].querySelector('input[name="cidm_contact"]').checked = true;
        }
    }

    addContactBtn.addEventListener('click', () => addContactRow({}));

    cancelBtn.addEventListener('click', async () => {
        const accepted = await window.cidmAdminUi.showConfirm('入力内容を破棄して戻りますか？', { confirmText: '戻る' });
        if (!accepted) return;
        window.history.back();
    });

    document.addEventListener('DOMContentLoaded', async () => {
        setPageMode();
        const ok = await window.cidmAdminAuth.ensureAuthenticated(supabaseClient, 'admin.html');
        if (!ok) return;
        if (isEditMode) {
            await loadEditData();
        } else {
            addContactRow({ is_primary: true, is_cidm_contact: true });
        }
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        await window.cidmAdminUi.runWithButtonBusy(submitBtn, async () => {
            const ok = await window.cidmAdminAuth.ensureAuthenticated(supabaseClient, 'admin.html');
            if (!ok) return;

            const contacts = collectContacts();
            if (contacts.length === 0) {
                window.cidmAdminUi.showToast('担当者を1名以上入力してください。', 'error', 2600);
                return;
            }
            if (!contacts.some((contact) => contact.is_primary)) contacts[0].is_primary = true;
            if (!contacts.some((contact) => contact.is_cidm_contact)) contacts[0].is_cidm_contact = true;

            const primaryContact = contacts.find((contact) => contact.is_primary) || contacts[0];
            const memberData = {
                division_flag: form.division_flag.value || '会員',
                member_type: form.member_type.value || null,
                is_officer: form.is_officer.checked,
                cidm_role: form.cidm_role.value.trim() || null,
                company_name: form.company_name.value.trim(),
                representative_name: form.representative_name.value.trim(),
                zip_code: form.zip_code.value.trim() || null,
                address: form.address.value.trim() || null,
                phone_number: form.phone_number.value.trim() || null,
                fax_number: form.fax_number.value.trim() || null,
                staff_name: primaryContact.name || null,
                staff_mobile: primaryContact.phone || null,
                staff_email: primaryContact.email || null,
                department: primaryContact.department || null,
                job_title: primaryContact.job_title || null,
                biko: primaryContact.biko || null
            };

            if (!memberData.company_name || !memberData.representative_name) {
                window.cidmAdminUi.showToast('会社名と代表者名は必須です。', 'error', 2400);
                return;
            }

            if (!isEditMode) {
                const { data: inserted, error: insertError } = await supabaseClient.from('member').insert([memberData]).select('id').single();
                if (insertError || !inserted) {
                    window.cidmAdminUi.showToast('登録に失敗しました: ' + (insertError?.message || 'unknown error'), 'error', 3000);
                    return;
                }
                const payload = contacts.map((contact) => ({ ...contact, member_id: inserted.id }));
                const { error: contactError } = await supabaseClient.from('member_contacts').insert(payload);
                if (contactError) {
                    window.cidmAdminUi.showToast('担当者情報の登録に失敗しました: ' + contactError.message, 'error', 3600);
                    return;
                }
                window.cidmAdminUi.showToast('登録が完了しました。招待メールを送信してください。', 'success', 2200);
                setTimeout(() => { window.location.href = `admin-member-new.html?id=${inserted.id}`; }, 500);
                return;
            }

            const { error: updateError } = await supabaseClient.from('member').update(memberData).eq('id', memberId);
            if (updateError) {
                window.cidmAdminUi.showToast('更新に失敗しました: ' + updateError.message, 'error', 3000);
                return;
            }
            const { error: deleteError } = await supabaseClient.from('member_contacts').delete().eq('member_id', memberId);
            if (deleteError) {
                window.cidmAdminUi.showToast('担当者情報の更新準備に失敗しました: ' + deleteError.message, 'error', 3600);
                return;
            }
            const payload = contacts.map((contact) => ({ ...contact, member_id: memberId }));
            const { error: insertContactError } = await supabaseClient.from('member_contacts').insert(payload);
            if (insertContactError) {
                window.cidmAdminUi.showToast('担当者情報の更新に失敗しました: ' + insertContactError.message, 'error', 3600);
                return;
            }
            window.cidmAdminUi.showToast('更新が完了しました。', 'success', 1200);
            setTimeout(() => { window.location.href = `admin-members.html?id=${memberId}`; }, 500);
        }, isEditMode ? '更新中...' : '登録中...');
    });
    </script>
