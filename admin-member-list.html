<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員一覧 | 管理者ポータル</title>
    <link rel="icon" type="image/png" href="./CIDMchara.png">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./admin.css">
    <style>

        /* Body */
        .admin-body { flex:1; padding:2.25rem 1.2rem 4rem; max-width:1200px; margin:0 auto; width:100%; }

        /* Page heading */
        .page-heading { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
        .page-heading .left .eyebrow { font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#3b82f6; margin-bottom:0.35rem; }
        .page-heading .left h1 { font-size:1.7rem; font-weight:700; color:#1e293b; }

        /* New button */
        .btn-new { display:inline-flex; align-items:center; gap:0.5rem; background:linear-gradient(135deg,#2563eb,#0ea5e9); color:#fff; border:none; padding:0.65rem 1.4rem; border-radius:9999px; font-size:0.84rem; font-weight:700; cursor:pointer; text-decoration:none; transition:opacity 0.15s, transform 0.12s; box-shadow:0 8px 18px rgba(37, 99, 235, 0.2); }
        .btn-new:hover { opacity:0.88; transform:translateY(-1px); }
        .filter-bar { margin-top:0.4rem; display:flex; gap:1rem; align-items:center; color:#64748b; font-size:0.84rem; flex-wrap:nowrap; white-space:nowrap; }
        .filter-chip { display:inline-flex; align-items:center; gap:0.45rem; border:1px solid #cbd5e1; border-radius:9999px; padding:0.35rem 0.75rem; background:#ffffff; }
        .filter-chip input[type=checkbox] { accent-color:#3b82f6; }
        .status-badge { display:inline-flex; align-items:center; justify-content:center; border-radius:9999px; padding:0.22rem 0.62rem; font-size:0.72rem; font-weight:700; letter-spacing:0.04em; white-space:nowrap; }
        .status-pending { background:#fef3c7; color:#92400e; }
        .status-approved { background:#dcfce7; color:#166534; }
        .status-returned { background:#e0f2fe; color:#0c4a6e; }
        .status-rejected { background:#fee2e2; color:#991b1b; }

        /* Table card */
        .table-card { background:#ffffff; border:1px solid #dbe4ef; border-radius:1rem; overflow-x:auto; box-shadow:0 1px 6px rgba(15, 23, 42, 0.08); }
        .member-table { width:100%; border-collapse:collapse; }
        .member-table th { background:#f8fbff; color:#64748b; font-size:0.72rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:0.85rem 1rem; text-align:left; border-bottom:1px solid #e2e8f0; }
        .member-table td { padding:0.9rem 1rem; border-bottom:1px solid #edf2f7; color:#334155; font-size:0.88rem; }
        .member-table tbody tr:last-child td { border-bottom:none; }
        .member-table tbody tr { cursor:pointer; transition:background 0.12s; }
        .member-table tbody tr:hover td { background:#f8fbff; }
        .company-name { font-weight:700; color:#1e293b; }
        .sub-text { color:#64748b; font-size:0.8rem; }
        .admin-check-btn {
            background:#dc2626 !important;
            border:1px solid #b91c1c !important;
            color:#ffffff !important;
            box-shadow:0 8px 18px rgba(220, 38, 38, 0.24) !important;
            min-width:2.2rem;
            justify-content:center;
        }
        .admin-check-btn:hover { opacity:0.9; }
        .admin-check-btn:disabled { opacity:0.82; }

    </style>
</head>
<body>
    <header class="admin-header">
        <a href="admin-portal.html" class="brand">
            <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="brand-text">CIDM <span>管理者ポータル</span></div>
        </a>
        <a href="admin-portal.html" class="header-back"><i class="fa-solid fa-chevron-left"></i> ポータルへ戻る</a>
    </header>

    <div class="admin-body">
        <div class="page-heading">
            <div class="left">
                <p class="eyebrow">Member Management</p>
                <h1>会員一覧</h1>
                <div class="filter-bar">
                    <span>区分:</span>
                    <label class="filter-chip"><input type="checkbox" id="division-member" checked> 会員</label>
                    <label class="filter-chip"><input type="checkbox" id="division-related" checked> 関係者</label>
                    <label class="filter-chip"><input type="checkbox" id="status-pending-only"> 未審査のみ</label>
                </div>
            </div>
            <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
            <button id="bulk-invite-btn" class="btn-new" style="background:linear-gradient(135deg,#0891b2,#0ea5e9);"><i class="fa-solid fa-envelope"></i> 全員に招待メール送信</button>
            <a href="admin-member-new.html" class="btn-new"><i class="fa-solid fa-user-plus"></i> 新規追加</a>
        </div>
        </div>

        <div class="table-card">
            <table class="member-table">
                <thead>
                    <tr>
                        <th>審査状態</th>
                        <th>区分</th>
                        <th>会員種別</th>
                        <th>役員</th>
                        <th>会社名</th>
                        <th>CIDM役職</th>
                        <th>主担当者名</th>
                        <th>主担当携帯</th>
                        <th>主担当メール</th>
                        <th>登録人数</th>
                        <th>備考</th>
                        <th>招待</th>
                        <th id="admin-role-col-header">管理者</th>
                    </tr>
                </thead>
                <tbody id="members-tbody">
                    <tr><td colspan="11" style="text-align:center; color:#475569; padding:2rem;">読み込み中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="admin-footer">© 2013–2026 Center for Innovative Data and Mobility</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./cidm-config.js"></script>
    <script src="./admin-auth.js"></script>
    <script src="./admin-ui.js"></script>
    <script>
    const supabaseClient = window.cidmAdminAuth.createSupabaseClient();
    let isSuperAdmin = false;

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getStatusMeta(status) {
        switch (status) {
            case '未審査':
                return { className: 'status-badge status-pending', label: '未審査' };
            case '差戻し':
                return { className: 'status-badge status-returned', label: '差戻し' };
            case '却下':
                return { className: 'status-badge status-rejected', label: '却下' };
            case '承認済':
            default:
                return { className: 'status-badge status-approved', label: status || '承認済' };
        }
    }

    function renderLoadingRows() {
        const cell = window.cidmAdminUi.getSkeletonLine('100%', '0.9rem');
        const cols = 13;
        return Array.from({ length: 6 }).map(() =>
            `<tr>${Array.from({ length: cols }).map(() => `<td>${cell}</td>`).join('')}</tr>`
        ).join('');
    }

    async function sendInvite(contactId, email) {
        const { data, error } = await supabaseClient.functions.invoke('member-password-reset', {
            body: { action: 'invite', contact_id: contactId }
        });
        if (error) throw new Error(error.message || '送信失敗');
        if (!data?.ok) throw new Error(data?.error || '送信失敗');
        return email;
    }

    function renderMembers(data) {
        const tbody = document.getElementById('members-tbody');
        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:#888;">該当する会員データはありません</td></tr>`;
            return;
        }

        const roleRank = {
            '理事長': 1,
            '理事長代理': 2,
            '副理事長': 3,
            '常務': 4,
            '理事': 5,
            '監事': 6,
            '顧問': 7,
            '事務局長': 8,
            'アドバイザリーボード': 9
        };
        const memberTypeRank = {
            '正会員': 1,
            '準会員': 2,
            '賛助会員': 3
        };

        const sorted = [...data].sort((a, b) => {
            const aOfficer = a.is_officer ? 0 : 1;
            const bOfficer = b.is_officer ? 0 : 1;
            if (aOfficer !== bOfficer) return aOfficer - bOfficer;

            const aRole = roleRank[a.cidm_role || ''] ?? 99;
            const bRole = roleRank[b.cidm_role || ''] ?? 99;
            if (aRole !== bRole) return aRole - bRole;

            const aType = memberTypeRank[a.member_type || ''] ?? 99;
            const bType = memberTypeRank[b.member_type || ''] ?? 99;
            if (aType !== bType) return aType - bType;

            return String(a.company_name || '').localeCompare(String(b.company_name || ''), 'ja');
        });

        tbody.innerHTML = sorted.map(item => {
            const statusMeta = getStatusMeta(item.application_status || '承認済');
            const note = item.application_review_note ? `<div class="sub-text">${escapeHtml(item.application_review_note)}</div>` : '';
            const isAdmin = item.app_role === 'admin';
            const inviteCell = `
                <td style="text-align:center;">
                    <button
                        class="btn btn-primary"
                        style="font-size:0.72rem; padding:0.3rem 0.7rem;"
                        data-invite-contact="${item.primary_contact_id || ''}"
                        data-invite-email="${escapeHtml(item.staff_email || '')}"
                        ${!item.primary_contact_id ? 'disabled title="担当者情報なし"' : ''}
                    ><i class="fa-solid fa-envelope"></i></button>
                </td>`;
            const adminCell = `
                <td style="text-align:center;">
                    <button
                        class="btn ${isAdmin ? 'admin-check-btn' : 'btn-primary'}"
                        style="font-size:0.72rem; padding:0.3rem 0.7rem;"
                        ${isSuperAdmin ? `data-toggle-admin="${item.id}"` : ''}
                        data-current-role="${item.app_role || 'member'}"
                        ${isSuperAdmin ? '' : 'disabled title="権限変更はスーパー管理者のみ可能です"'}
                    >${isAdmin ? '✓' : '－'}</button>
                </td>`;
            return `
            <tr style="cursor:pointer;" data-member-id="${item.id}">
                <td><span class="${statusMeta.className}">${statusMeta.label}</span>${note}</td>
                <td>${item.division_flag || '会員'}</td>
                <td>${item.member_type || ''}</td>
                <td>${item.is_officer ? 'はい' : '-'}</td>
                <td><span class="company-name">${item.company_name || ''}</span></td>
                <td>${item.cidm_role || ''}</td>
                <td>${item.staff_name || ''}</td>
                <td><span class="sub-text">${item.staff_mobile || ''}</span></td>
                <td><span class="sub-text">${item.staff_email || ''}</span></td>
                <td><span class="sub-text">${Math.max(1, Number(item.contact_count || 0))}名</span></td>
                <td><span class="sub-text">${item.biko || ''}</span></td>
                ${inviteCell}
                ${adminCell}
            </tr>
        `;
        }).join('');
    }

    async function loadMembers() {
        const tbody = document.getElementById('members-tbody');
        tbody.innerHTML = renderLoadingRows();
        const includeMember = Boolean(document.getElementById('division-member')?.checked);
        const includeRelated = Boolean(document.getElementById('division-related')?.checked);
        const pendingOnly = Boolean(document.getElementById('status-pending-only')?.checked);

        const { data: members, error: memberError } = await supabaseClient.rpc('cidm_admin_list_members', {
            p_include_member: includeMember,
            p_include_related: includeRelated,
            p_include_pending_only: pendingOnly
        });

        if (memberError) {
            const cols = 13;
            tbody.innerHTML = `<tr><td colspan="${cols}" style="color:red; text-align:center;">データ取得エラー</td></tr>`;
            return;
        }
        if (!members || members.length === 0) {
            const cols = 13;
            tbody.innerHTML = `<tr><td colspan="${cols}" style="text-align:center; color:#888;">会員データはありません</td></tr>`;
            return;
        }

        renderMembers(members);
    }

    document.getElementById('members-tbody')?.addEventListener('click', async (event) => {
        // 招待メール送信ボタン
        const inviteBtn = event.target.closest('[data-invite-contact]');
        if (inviteBtn) {
            event.stopPropagation();
            const contactId = inviteBtn.getAttribute('data-invite-contact');
            const email = inviteBtn.getAttribute('data-invite-email');
            if (!contactId) return;
            const confirmed = await window.cidmAdminUi.showConfirm(
                `${email} に招待メールを送信しますか？`,
                { confirmText: '送信する' }
            );
            if (!confirmed) return;
            await window.cidmAdminUi.runWithButtonBusy(inviteBtn, async () => {
                await sendInvite(contactId, email);
                window.cidmAdminUi.showToast(`招待メールを送信しました: ${email}`, 'success', 3000);
            }, '送信中...');
            return;
        }

        // 管理者トグルボタン
        const toggleBtn = event.target.closest('[data-toggle-admin]');
        if (toggleBtn) {
            event.stopPropagation();
            const memberId = toggleBtn.getAttribute('data-toggle-admin');
            const currentRole = toggleBtn.getAttribute('data-current-role');
            const newRole = currentRole === 'admin' ? 'member' : 'admin';
            const label = newRole === 'admin' ? '管理者権限を付与' : '管理者権限を解除';
            const confirmed = await window.cidmAdminUi.showConfirm(`${label}しますか？`, { confirmText: newRole === 'admin' ? '付与する' : '解除する' });
            if (!confirmed) return;
            await window.cidmAdminUi.runWithButtonBusy(toggleBtn, async () => {
                const { error } = await supabaseClient.rpc('cidm_set_member_app_role', {
                    p_member_id: memberId,
                    p_role: newRole
                });
                if (error) throw new Error(error.message);
                window.cidmAdminUi.showToast(
                    newRole === 'admin' ? '管理者権限を付与しました。' : '管理者権限を解除しました。',
                    'success', 2200
                );
                await loadMembers();
            }, '処理中...');
            return;
        }

        // 行クリック → 詳細画面へ
        const row = event.target.closest('tr[data-member-id]');
        if (!row) return;
        const id = row.getAttribute('data-member-id');
        if (!id) return;
        window.location.href = 'admin-members.html?id=' + id;
    });

    document.addEventListener('DOMContentLoaded', async () => {
        const ok = await window.cidmAdminAuth.ensureAuthenticated(supabaseClient, 'admin.html');
        if (!ok) return;

        // 管理者なら全員が権限変更可能
        isSuperAdmin = true;

        // 一斉招待ボタン
        document.getElementById('bulk-invite-btn')?.addEventListener('click', async () => {
            const confirmed = await window.cidmAdminUi.showConfirm(
                '表示中の全会員に招待メールを送信しますか？\n※ すでに登録済みの方にも再送されます。',
                { confirmText: '一斉送信する' }
            );
            if (!confirmed) return;
            const btn = document.getElementById('bulk-invite-btn');
            await window.cidmAdminUi.runWithButtonBusy(btn, async () => {
                const rows = document.querySelectorAll('[data-invite-contact]');
                let sent = 0, failed = 0;
                for (const row of rows) {
                    const contactId = row.getAttribute('data-invite-contact');
                    const email = row.getAttribute('data-invite-email');
                    if (!contactId) continue;
                    try {
                        await sendInvite(contactId, email);
                        sent++;
                    } catch {
                        failed++;
                    }
                }
                window.cidmAdminUi.showToast(
                    `招待メール送信完了: ${sent}件成功${failed > 0 ? ` / ${failed}件失敗` : ''}`,
                    failed > 0 ? 'error' : 'success', 4000
                );
            }, '送信中...');
        });

        document.getElementById('division-member')?.addEventListener('change', loadMembers);
        document.getElementById('division-related')?.addEventListener('change', loadMembers);
        document.getElementById('status-pending-only')?.addEventListener('change', loadMembers);
        loadMembers();
    });
    </script>
</body>
</html>
