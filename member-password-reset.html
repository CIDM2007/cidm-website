<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員パスワード再設定 | CIDM</title>
    <link rel="icon" type="image/png" href="./CIDMchara.png">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-lg bg-white border border-slate-200 rounded-2xl shadow-xl p-8 md:p-10">
        <div class="text-center mb-7">
            <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-unlock-keyhole text-xl text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">新しいパスワード設定</h1>
            <p class="text-sm text-slate-500 mt-2">8文字以上で入力してください。</p>
        </div>

        <form id="reset-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">New Password</label>
                <input id="new-password" type="password" required minlength="8" class="w-full border border-slate-200 px-4 py-3 rounded-xl outline-none focus:border-blue-400" placeholder="8文字以上">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Confirm Password</label>
                <input id="confirm-password" type="password" required minlength="8" class="w-full border border-slate-200 px-4 py-3 rounded-xl outline-none focus:border-blue-400" placeholder="再入力">
            </div>
            <button id="reset-submit" type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition">パスワードを更新</button>
        </form>

        <p id="status-text" class="text-sm text-slate-500 mt-4 text-center"></p>

        <div class="mt-7 text-center">
            <a id="return-link" href="index.html" class="text-sm font-bold text-blue-600 hover:text-blue-700">トップページへ戻る</a>
        </div>
    </div>

    <script src="./cidm-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = window.supabase.createClient(window.CIDM_SUPABASE_URL, window.CIDM_SUPABASE_ANON_KEY);

        const form = document.getElementById('reset-form');
        const submit = document.getElementById('reset-submit');
        const statusText = document.getElementById('status-text');
        const returnLink = document.getElementById('return-link');

        // URL から custom token を取得
        const urlParams = new URLSearchParams(window.location.search);
        const customToken = urlParams.get('token');
        const fromAdmin = urlParams.get('from') === 'admin';

        function getRecoverySessionFromHash() {
            const rawHash = String(window.location.hash || '').replace(/^#/, '');
            if (!rawHash) {
                return null;
            }

            const hashParams = new URLSearchParams(rawHash);
            const type = hashParams.get('type');
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');

            if (type !== 'recovery' || !accessToken || !refreshToken) {
                return null;
            }

            return {
                access_token: accessToken,
                refresh_token: refreshToken
            };
        }

        async function trySetupRecoverySession() {
            const recoverySession = getRecoverySessionFromHash();
            if (!recoverySession) {
                return false;
            }

            const { error } = await supabaseClient.auth.setSession(recoverySession);
            if (error) {
                throw new Error(error.message || '再設定セッションの準備に失敗しました。');
            }

            if (window.location.hash) {
                window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
            }

            return true;
        }

        function setBusy(busy) {
            submit.disabled = busy;
            submit.textContent = busy ? '更新中...' : 'パスワードを更新';
            submit.style.opacity = busy ? '0.7' : '';
            submit.style.cursor = busy ? 'not-allowed' : '';
        }

        function setStatus(message, isError = false) {
            statusText.textContent = message;
            statusText.className = isError
                ? 'text-sm text-red-600 mt-4 text-center'
                : 'text-sm text-slate-500 mt-4 text-center';
        }

        // カスタムトークンを使って Edge Function の action=consume を呼ぶ
        async function consumeWithCustomToken(newPassword, confirmPassword) {
            const res = await fetch(`${window.CIDM_SUPABASE_URL}/functions/v1/member-password-reset`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': window.CIDM_SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${window.CIDM_SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({
                    action: 'consume',
                    token: customToken,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });
            const json = await res.json();
            if (!res.ok || !json.ok) {
                throw new Error(json.error || 'パスワード更新に失敗しました。');
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const newPassword = document.getElementById('new-password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();

            if (!newPassword || newPassword.length < 8) {
                setStatus('新しいパスワードは8文字以上で入力してください。', true);
                return;
            }

            if (newPassword !== confirmPassword) {
                setStatus('確認用パスワードが一致しません。', true);
                return;
            }

            setBusy(true);
            setStatus('');
            let completed = false;

            try {
                if (customToken) {
                    // 招待・リセットメールからのカスタムトークンフロー
                    await consumeWithCustomToken(newPassword, confirmPassword);
                } else {
                    // Supabase Auth のリカバリーセッションフロー（管理者用）
                    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
                    if (error) throw new Error(error.message || 'パスワード更新に失敗しました。');
                }

                setStatus('パスワードを更新しました。ログイン画面からお試しください。');
                form.reset();
                submit.disabled = true;
                submit.style.opacity = '0.7';
                completed = true;
            } catch (error) {
                setStatus(String(error && error.message ? error.message : 'パスワード更新に失敗しました。'), true);
            } finally {
                if (!completed) {
                    setBusy(false);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (fromAdmin) {
                returnLink.href = 'admin.html';
                returnLink.textContent = '管理者ログインへ戻る';
            }

            try {
                const hasRecoverySession = await trySetupRecoverySession();
                if (customToken || hasRecoverySession) {
                    setStatus('新しいパスワードを入力してください。');
                    submit.disabled = false;
                    submit.style.opacity = '';
                    return;
                }
            } catch (error) {
                setStatus(String(error && error.message ? error.message : '再設定リンクが無効です。'), true);
                submit.disabled = true;
                submit.style.opacity = '0.7';
                return;
            }

            setStatus('再設定メールのリンクからこの画面を開いてください。', true);
            submit.disabled = true;
            submit.style.opacity = '0.7';
        });
    </script>
</body>
</html>
