<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員パスワード設定 | CIDM</title>
    <link rel="icon" type="image/png" href="./CIDMchara.png">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-lg bg-white border border-slate-200 rounded-2xl shadow-xl p-8 md:p-10">
        <div class="text-center mb-7">
            <div class="w-14 h-14 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-unlock-keyhole text-xl text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">新しいパスワード設定</h1>
            <p class="text-sm text-slate-500 mt-2">8文字以上で入力してください。</p>
        </div>

        <form id="reset-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">New Password</label>
                <input id="new-password" type="password" required minlength="8" class="w-full border border-slate-200 px-4 py-3 rounded-xl outline-none focus:border-blue-400" placeholder="8文字以上">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Confirm Password</label>
                <input id="confirm-password" type="password" required minlength="8" class="w-full border border-slate-200 px-4 py-3 rounded-xl outline-none focus:border-blue-400" placeholder="再入力">
            </div>
            <button id="reset-submit" type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition">パスワードを設定する</button>
        </form>

        <p id="status-text" class="text-sm mt-4 text-center text-slate-500"></p>

        <div class="mt-7 text-center">
            <a href="index.html" class="text-sm font-bold text-blue-600 hover:text-blue-700">トップページへ戻る</a>
        </div>
    </div>

    <script src="./cidm-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = window.supabase.createClient(
            window.CIDM_SUPABASE_URL,
            window.CIDM_SUPABASE_ANON_KEY
        );

        const form = document.getElementById('reset-form');
        const submit = document.getElementById('reset-submit');
        const statusText = document.getElementById('status-text');

        function setStatus(message, isError = false) {
            statusText.textContent = message;
            statusText.className = isError
                ? 'text-sm mt-4 text-center text-red-600'
                : 'text-sm mt-4 text-center text-slate-500';
        }

        function setBusy(busy) {
            submit.disabled = busy;
            submit.textContent = busy ? '設定中...' : 'パスワードを設定する';
            submit.style.opacity = busy ? '0.7' : '';
        }

        // Supabase Auth が URL ハッシュ（#access_token=...&type=invite/recovery）を
        // 自動的に処理してセッションを確立する
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
                if (session) {
                    submit.disabled = false;
                    submit.style.opacity = '';
                    setStatus('新しいパスワードを入力してください。');
                }
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('new-password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();

            if (newPassword.length < 8) {
                setStatus('パスワードは8文字以上で入力してください。', true);
                return;
            }
            if (newPassword !== confirmPassword) {
                setStatus('確認用パスワードが一致しません。', true);
                return;
            }

            setBusy(true);
            setStatus('');

            try {
                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
                if (error) throw new Error(error.message);

                setStatus('パスワードを設定しました。ログイン画面からお試しください。');
                form.reset();
                submit.disabled = true;
                submit.style.opacity = '0.7';

                // 3秒後にトップページへ
                setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            } catch (err) {
                setStatus(err.message || 'パスワード設定に失敗しました。', true);
                setBusy(false);
            }
        });

        // 初期状態：セッションがあるか確認
        document.addEventListener('DOMContentLoaded', async () => {
            submit.disabled = true;
            submit.style.opacity = '0.7';
            setStatus('リンクを確認中...');

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                submit.disabled = false;
                submit.style.opacity = '';
                setStatus('新しいパスワードを入力してください。');
            } else {
                setStatus('招待メールのリンクからこのページを開いてください。', true);
            }
        });
    </script>
</body>
</html>
