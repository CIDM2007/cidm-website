<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会費請求書 | CIDM</title>
    <link rel="icon" type="image/png" href="./CIDMchara.png">
    <link href="./output.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: 'Noto Sans JP', sans-serif;
            color: #0f172a;
            background:
                radial-gradient(900px 420px at 20% 0%, #dbeafe 0%, transparent 58%),
                radial-gradient(780px 360px at 90% 0%, #e0e7ff 0%, transparent 52%),
                linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        }
        .wrap {
            width: min(980px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 2rem 0 3rem;
        }
        .shell {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dbe4ef;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.10);
            overflow: hidden;
        }
        .head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.2rem 1.3rem;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #f8fafc;
        }
        .head p {
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            color: #93c5fd;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }
        .head h1 {
            font-size: 1.34rem;
            line-height: 1.4;
        }
        .head .meta {
            font-size: 0.82rem;
            color: #bfdbfe;
            line-height: 1.6;
            text-align: right;
        }
        .body {
            padding: 1.3rem;
        }
        .notice {
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1e3a8a;
            border-radius: 14px;
            padding: 0.95rem 1rem;
            font-size: 0.92rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        .panel {
            border: 1px solid #dbe4ef;
            border-radius: 16px;
            background: #ffffff;
            overflow: hidden;
        }
        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .panel-head h2 {
            font-size: 1rem;
            color: #1e293b;
        }
        .btn {
            border: 0;
            border-radius: 9999px;
            padding: 0.52rem 0.95rem;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.18);
        }
        .grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 0;
        }
        .card {
            padding: 1rem;
        }
        .card + .card {
            border-left: 1px solid #e2e8f0;
        }
        .kv {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 0.55rem 1rem;
            align-items: start;
        }
        .k {
            color: #64748b;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .v {
            color: #0f172a;
            font-size: 0.96rem;
            line-height: 1.6;
        }
        .amount {
            font-size: clamp(1.7rem, 3vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #0f172a;
        }
        .amount small {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            border-radius: 9999px;
            padding: 0.25rem 0.7rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .status.success {
            color: #166534;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }
        .status.failed {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }
        .footer {
            padding: 1rem 1.3rem 1.2rem;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 0.76rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .error-box {
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #b91c1c;
            border-radius: 14px;
            padding: 1rem;
            line-height: 1.7;
        }
        .loading {
            color: #64748b;
            font-size: 0.92rem;
        }
        @media (max-width: 820px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .card + .card {
                border-left: 0;
                border-top: 1px solid #e2e8f0;
            }
            .head {
                flex-direction: column;
            }
            .head .meta {
                text-align: left;
            }
            .kv {
                grid-template-columns: 1fr;
                gap: 0.2rem;
            }
        }
        @media print {
            body {
                background: #fff;
            }
            .wrap {
                width: 100%;
                padding: 0;
            }
            .btn {
                display: none;
            }
            .shell {
                border: 0;
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="shell">
            <div class="head">
                <div>
                    <p>Membership Invoice</p>
                    <h1>会費請求書</h1>
                </div>
                <div class="meta" id="header-meta">請求書を読み込み中...</div>
            </div>
            <div class="body">
                <div id="status-area" class="notice loading">請求情報を取得しています...</div>
                <div id="invoice-view" style="display:none;">
                    <div class="panel">
                        <div class="panel-head">
                            <h2 id="recipient-title">宛先</h2>
                            <button type="button" class="btn" onclick="window.print()">印刷</button>
                        </div>
                        <div class="grid">
                            <div class="card">
                                <div class="kv">
                                    <div class="k">請求番号</div><div class="v" id="invoice-no"></div>
                                    <div class="k">会社名</div><div class="v" id="company-name"></div>
                                    <div class="k">担当者</div><div class="v" id="staff-name"></div>
                                    <div class="k">メール</div><div class="v" id="staff-email"></div>
                                    <div class="k">会員種別</div><div class="v" id="member-type"></div>
                                </div>
                            </div>
                            <div class="card">
                                <div class="kv">
                                    <div class="k">請求年度</div><div class="v" id="billing-year"></div>
                                    <div class="k">請求月</div><div class="v" id="billing-month"></div>
                                    <div class="k">支払期限</div><div class="v" id="due-date"></div>
                                    <div class="k">送信日時</div><div class="v" id="issued-at"></div>
                                    <div class="k">状態</div><div class="v"><span id="send-status" class="status"></span></div>
                                </div>
                            </div>
                        </div>
                        <div class="card" style="border-top:1px solid #e2e8f0;">
                            <div class="k" style="margin-bottom:0.35rem;">請求金額</div>
                            <div class="amount" id="amount"></div>
                        </div>
                    </div>
                </div>
                <div id="error-area" style="display:none;" class="error-box"></div>
            </div>
            <div class="footer">© 2013–2026 Center for Innovative Data and Mobility</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./cidm-config.js"></script>
    <script>
        const supabaseClient = window.supabase.createClient(
            window.CIDM_SUPABASE_URL,
            window.CIDM_SUPABASE_ANON_KEY
        );

        const statusArea = document.getElementById('status-area');
        const invoiceView = document.getElementById('invoice-view');
        const errorArea = document.getElementById('error-area');
        const headerMeta = document.getElementById('header-meta');

        function getToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token') || '';
        }

        function formatMonth(year, month) {
            return `${year}年度 ${month}月`;
        }

        function formatDateTime(value) {
            if (!value) return '未送信';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString('ja-JP');
        }

        function formatMoney(amount) {
            const value = Number(amount || 0);
            return `¥${value.toLocaleString('ja-JP')}`;
        }

        function setError(message) {
            statusArea.style.display = 'none';
            invoiceView.style.display = 'none';
            errorArea.style.display = 'block';
            errorArea.textContent = message;
            headerMeta.textContent = '読み込み失敗';
        }

        function setInvoice(data) {
            document.getElementById('invoice-no').textContent = data.invoice_no || '';
            document.getElementById('company-name').textContent = data.company_name || '';
            document.getElementById('staff-name').textContent = data.staff_name || '';
            document.getElementById('staff-email').textContent = data.staff_email || '';
            document.getElementById('member-type').textContent = data.member_type || '';
            document.getElementById('billing-year').textContent = `${data.billing_year || ''}年度`;
            document.getElementById('billing-month').textContent = `${data.billing_month || ''}月`;
            document.getElementById('due-date').textContent = data.due_date || '';
            document.getElementById('issued-at').textContent = formatDateTime(data.issued_at);
            document.getElementById('amount').textContent = formatMoney(data.amount);

            const statusEl = document.getElementById('send-status');
            statusEl.textContent = data.send_status === 'success' ? '送信済み' : '作成済み';
            statusEl.className = 'status ' + (data.send_status === 'success' ? 'success' : 'failed');

            document.getElementById('recipient-title').textContent = `${data.company_name || ''}${data.staff_name ? ' / ' + data.staff_name : ''}`;
            headerMeta.textContent = `${data.invoice_no || ''} ・ ${formatMonth(data.billing_year || '', data.billing_month || '')}`;
            statusArea.style.display = 'none';
            errorArea.style.display = 'none';
            invoiceView.style.display = 'block';
        }

        async function loadInvoice() {
            const token = getToken();
            if (!token) {
                setError('URLに token がありません。請求書のリンクを確認してください。');
                return;
            }

            const { data, error } = await supabaseClient.rpc('cidm_get_membership_invoice_by_token', { p_token: token });
            if (error || !Array.isArray(data) || !data[0]) {
                setError('請求情報を取得できませんでした。リンクが無効か、期限切れの可能性があります。');
                return;
            }

            setInvoice(data[0]);
        }

        loadInvoice();
    </script>
</body>
</html>
