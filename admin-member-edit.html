<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員編集 | 管理者ポータル</title>
    <link rel="icon" type="image/png" href="./CIDMchara.png">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background:
                radial-gradient(1200px 500px at 20% -10%, #dbeafe 0%, transparent 60%),
                radial-gradient(900px 400px at 85% -5%, #e0e7ff 0%, transparent 55%),
                #eef2f7;
            color: #1e293b;
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .admin-header { display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; height:72px; background:rgba(255, 255, 255, 0.78); backdrop-filter:blur(8px); border-bottom:1px solid #dbe4ef; position:sticky; top:0; z-index:10; box-shadow:0 1px 8px rgba(15, 23, 42, 0.06); }
        .brand { display:flex; align-items:center; gap:0.75rem; text-decoration:none; }
        .brand-icon { width:38px; height:38px; background:linear-gradient(135deg,#2563eb,#0ea5e9); border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1rem; }
        .brand-text { font-size:0.78rem; font-weight:700; color:#64748b; letter-spacing:0.1em; text-transform:uppercase; }
        .brand-text span { display:block; color:#1e293b; font-size:0.9rem; letter-spacing:0.04em; }
        .header-back { display:inline-flex; align-items:center; gap:0.4rem; color:#475569; text-decoration:none; font-size:0.76rem; font-weight:700; letter-spacing:0.06em; border:1px solid #bfdbfe; background:#eff6ff; border-radius:9999px; padding:0.35rem 0.95rem; transition:color 0.15s, border-color 0.15s, background 0.15s; }
        .header-back:hover { color:#1d4ed8; border-color:#93c5fd; background:#dbeafe; }

        .admin-body { flex:1; padding:2.25rem 1.2rem 4rem; max-width:760px; margin:0 auto; width:100%; }
        .form-card { background:#ffffff; border:1px solid #dbe4ef; border-radius:1rem; padding:2rem 2rem 1.75rem; box-shadow:0 1px 6px rgba(15, 23, 42, 0.08); }
        .form-heading { margin-bottom:1.6rem; border-bottom:1px solid #e2e8f0; padding-bottom:1.1rem; }
        .eyebrow { font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#3b82f6; margin-bottom:0.35rem; }
        .form-heading h1 { font-size:1.55rem; font-weight:700; color:#1e293b; display:flex; align-items:center; gap:0.5rem; }

        .form-group { margin-bottom: 1.15rem; }
        label { display:block; font-size:0.78rem; font-weight:700; color:#64748b; letter-spacing:0.07em; text-transform:uppercase; margin-bottom:0.45rem; }
        input, textarea, select { width:100%; padding:0.72rem 0.9rem; border-radius:0.6rem; border:1px solid #cbd5e1; background:#f8fbff; color:#1e293b; font-size:0.92rem; font-family:inherit; transition:border-color 0.15s, box-shadow 0.15s; outline:none; }
        input:focus, textarea:focus, select:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.15); }
        textarea { min-height:84px; resize:vertical; }

        .form-actions { display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.6rem; padding-top:1.2rem; border-top:1px solid #e2e8f0; }
        .btn { padding:0.6rem 1.4rem; border-radius:0.6rem; font-size:0.84rem; font-weight:700; cursor:pointer; transition:opacity 0.15s, transform 0.12s; display:inline-flex; align-items:center; gap:0.35rem; border:none; }
        .btn:hover { transform:translateY(-1px); }
        .btn-submit { background:linear-gradient(135deg,#2563eb,#0ea5e9); color:#fff; box-shadow:0 8px 18px rgba(37, 99, 235, 0.2); }
        .btn-submit:hover { opacity:0.9; }
        .btn-cancel { background:#eff6ff; color:#475569; border:1px solid #bfdbfe; }
        .btn-cancel:hover { background:#dbeafe; color:#1d4ed8; border-color:#93c5fd; }

        .contact-row { border:1px solid #dbe4ef; border-radius:0.8rem; padding:0.9rem; margin-bottom:0.75rem; background:#f8fbff; }
        .contact-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem; }
        .contact-label { font-size:0.74rem; color:#3b82f6; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
        .contact-actions { display:flex; gap:0.7rem; align-items:center; color:#64748b; font-size:0.85rem; }
        .contact-del-btn { border:1px solid #fca5a5; background:#fee2e2; color:#b91c1c; border-radius:0.5rem; padding:0.2rem 0.55rem; cursor:pointer; font-weight:700; }
        .contact-del-btn:hover { background:#fecaca; color:#991b1b; }
        .contact-add-btn { width:100%; border:1px dashed #93c5fd; background:#eff6ff; color:#1d4ed8; border-radius:0.7rem; padding:0.55rem; cursor:pointer; font-weight:700; }
        .contact-add-btn:hover { background:#dbeafe; border-color:#60a5fa; }
        .officer-check-wrap { margin:-0.2rem 0 1.05rem; }
        .officer-check-label {
            display:flex;
            align-items:flex-start;
            gap:0.6rem;
            text-transform:none;
            letter-spacing:0;
            font-size:0.95rem;
            color:#1e293b;
            margin-bottom:0;
            cursor:pointer;
        }
        .officer-check-label input[type="checkbox"] {
            width:1rem;
            height:1rem;
            margin-top:0.15rem;
            accent-color:#2563eb;
            flex:0 0 auto;
        }
        .officer-check-title { font-weight:700; }
        .officer-check-help { display:block; margin-top:0.15rem; color:#64748b; font-size:0.78rem; line-height:1.5; }

        .admin-footer { text-align:center; padding:1.25rem; font-size:0.68rem; color:#64748b; letter-spacing:0.08em; text-transform:uppercase; border-top:1px solid #e2e8f0; }
    </style>
</head>
<body>
    <header class="admin-header">
        <a href="admin-portal.html" class="brand">
            <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="brand-text">CIDM <span>管理者ポータル</span></div>
        </a>
        <a href="admin-members.html?id=" class="header-back" id="back-to-member"><i class="fa-solid fa-chevron-left"></i> 会員詳細へ戻る</a>
    </header>

    <div class="admin-body">
        <div class="form-card">
            <div class="form-heading">
                <p class="eyebrow">Member Management</p>
                <h1><i class="fa-solid fa-user-pen"></i> 会員編集</h1>
            </div>
        <form id="member-form">
            <div class="form-group"><label for="division_flag">区分</label>
                <select id="division_flag" name="division_flag">
                    <option value="会員">会員</option>
                    <option value="関係者">関係者</option>
                </select>
            </div>
            <div class="form-group"><label for="member_type">会員種別</label>
                <select id="member_type" name="member_type">
                    <option value="">-- 未設定 --</option>
                    <option value="正会員">正会員</option>
                    <option value="準会員">準会員</option>
                    <option value="賛助">賛助</option>
                </select>
            </div>
            <div class="officer-check-wrap">
                <label for="is_officer" class="officer-check-label">
                    <input type="checkbox" id="is_officer" name="is_officer">
                    <span>
                        <span class="officer-check-title">この会員を役員として扱う</span>
                        <span class="officer-check-help">理事長・副理事長・理事・監事などの役員に該当する場合にチェックしてください。</span>
                    </span>
                </label>
            </div>
            <div class="form-group"><label for="cidm_role">CIDM役職</label><input type="text" id="cidm_role" name="cidm_role"></div>
            <div class="form-group"><label for="company_name">会社名</label><input type="text" id="company_name" name="company_name" required></div>
            <div class="form-group"><label for="department">部署</label><input type="text" id="department" name="department"></div>
            <div class="form-group"><label for="job_title">役職</label><input type="text" id="job_title" name="job_title"></div>
            <div class="form-group"><label for="representative_name">責任者名</label><input type="text" id="representative_name" name="representative_name" required></div>
            <div class="form-group"><label for="zip_code">郵便番号</label><input type="text" id="zip_code" name="zip_code"></div>
            <div class="form-group"><label for="address">住所</label><input type="text" id="address" name="address"></div>
            <div class="form-group"><label for="phone_number">電話番号</label><input type="text" id="phone_number" name="phone_number"></div>
            <div class="form-group"><label for="fax_number">FAX番号</label><input type="text" id="fax_number" name="fax_number"></div>
            <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
            <div id="login-section">
            <div class="form-group"><label for="login_id">ログイン用メールアドレス</label><input type="email" id="login_id" name="login_id" required placeholder="login@example.com" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
            <div class="form-group">
                <label for="member_password">パスワード再設定</label>
                <div style="position:relative;">
                    <input type="password" id="member_password" name="member_password" minlength="8" placeholder="変更する場合のみ入力" style="padding-right:4.5rem;">
                    <button type="button" id="member-password-toggle" style="position:absolute; right:0.6rem; top:50%; transform:translateY(-50%); border:none; background:transparent; color:#64748b; font-size:0.78rem; font-weight:700; cursor:pointer;">表示</button>
                </div>
                <p class="help" style="margin-top:0.35rem; color:#64748b; font-size:0.78rem;">入力した場合、更新後に初期ログイン情報のメールを送信します。</p>
            </div>
            <div class="form-group" style="margin-top:-0.8rem; color:#6b7280; font-size:0.92rem;">
                <span id="password-status">ログイン設定を確認中...</span>
            </div>
            </div><!-- /#login-section -->
            <div class="form-group">
                <label>担当者情報（複数）</label>
                <div id="contacts-list"></div>
                <button type="button" id="add-contact-btn" class="contact-add-btn">+ 担当者を追加</button>
            </div>
            <div id="staff-login-section" style="display:none;">
                <p style="font-size:0.78rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:#3b82f6; margin-bottom:1rem;"><i class="fa-solid fa-key"></i> 担当者ログイン設定</p>
                <div id="staff-login-list" style="space-y:0.75rem;"></div>
            </div>
            <div class="form-group"><label for="biko">備考</label><textarea id="biko" name="biko"></textarea></div>
            <div class="form-actions">
                <button type="button" id="cancel-btn" class="btn btn-cancel">キャンセル</button>
                <button type="submit" class="btn btn-submit">更新</button>
            </div>
        </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./cidm-config.js"></script>
    <script src="./admin-auth.js"></script>
    <script src="./admin-ui.js"></script>
    <script src="./admin-login-mail.js"></script>
    <script src="./admin-staff-login.js"></script>
    <script>
    const supabaseClient = window.cidmAdminAuth.createSupabaseClient();

    const form = document.getElementById('member-form');
    const cancelBtn = document.getElementById('cancel-btn');
    const submitBtn = form.querySelector('.btn-submit');
    const passwordStatus = document.getElementById('password-status');
    const memberPasswordInput = document.getElementById('member_password');
    const memberPasswordToggle = document.getElementById('member-password-toggle');
    const loginSection = document.getElementById('login-section');
    const divisionFlagSelect = document.getElementById('division_flag');
    const officerCheckbox = document.getElementById('is_officer');

    function updateLoginSectionByDivision(division) {
        const isKankei = division === '関係者';
        loginSection.style.opacity = isKankei ? '0.45' : '';
        loginSection.style.pointerEvents = isKankei ? 'none' : '';
        const loginIdInput = document.getElementById('login_id');
        if (loginIdInput) loginIdInput.required = !isKankei;
        if (memberPasswordInput) memberPasswordInput.disabled = isKankei;
        if (memberPasswordToggle) { memberPasswordToggle.disabled = isKankei; memberPasswordToggle.style.opacity = isKankei ? '0.55' : ''; }
    }

    divisionFlagSelect?.addEventListener('change', () => updateLoginSectionByDivision(divisionFlagSelect.value));
    const contactsList = document.getElementById('contacts-list');
    const addContactBtn = document.getElementById('add-contact-btn');
    const backToMemberLink = document.getElementById('back-to-member');

    // URLからid取得
    const urlParams = new URLSearchParams(window.location.search);
    const memberId = urlParams.get('id');
    if (memberId && backToMemberLink) {
        backToMemberLink.href = `admin-members.html?id=${memberId}`;
    }
    let loginRpcAvailable = true;
    let contactIndex = 0;

    memberPasswordToggle?.addEventListener('click', () => {
        const isPassword = memberPasswordInput?.type === 'password';
        if (!memberPasswordInput) return;
        memberPasswordInput.type = isPassword ? 'text' : 'password';
        memberPasswordToggle.textContent = isPassword ? '非表示' : '表示';
    });

    function renderPasswordStatus(settings) {
        if (!passwordStatus) return;
        if (!settings) {
            passwordStatus.textContent = 'ログイン設定を読み込めませんでした。';
            return;
        }
        const updatedAt = settings.password_updated_at
            ? new Date(settings.password_updated_at).toLocaleString('ja-JP')
            : '未設定';
        passwordStatus.textContent = settings.has_password
            ? `パスワード設定済み（最終更新: ${updatedAt}）`
            : 'パスワード未設定です。';
    }

    function isRlsPolicyError(error) {
        const msg = String(error?.message || '');
        return msg.includes('row-level security policy') || msg.includes('permission denied');
    }

    function addContactRow(contact = null) {
        const idx = contactIndex++;
        const row = document.createElement('div');
        row.className = 'contact-row';
        row.dataset.idx = idx;
        if (contact?.id) {
            row.dataset.contactId = contact.id;
        }
        const num = contactsList.children.length + 1;
        row.innerHTML = `
            <div class="contact-head">
                <span class="contact-label">担当者 ${num}</span>
                <div class="contact-actions">
                    <label><input type="radio" name="primary_contact" value="${idx}" ${contact?.is_primary ? 'checked' : ''}> 主担当</label>
                    <button type="button" class="contact-del-btn">削除</button>
                </div>
            </div>
            <div class="form-group"><label>担当者名</label><input type="text" name="contact_name[]" value="${contact?.name || ''}"></div>
            <div class="form-group"><label>担当者携帯</label><input type="text" name="contact_phone[]" value="${contact?.phone || ''}"></div>
            <div class="form-group"><label>担当者メール</label><input type="email" name="contact_email[]" value="${contact?.email || ''}"></div>
            <div class="form-group"><label><input type="checkbox" name="contact_receive_invite[]" ${contact?.receive_invite_mail === false ? '' : 'checked'}> 会議案内メールの送信対象に含める</label></div>
            <div class="form-group"><label><input type="checkbox" name="contact_receive_invoice[]" ${contact?.receive_invoice_mail === false ? '' : 'checked'}> 会費請求メールの送信対象に含める</label></div>
        `;
        row.querySelector('.contact-del-btn').addEventListener('click', () => {
            if (contactsList.children.length <= 1) return;
            const wasPrimary = row.querySelector('input[type=radio]').checked;
            row.remove();
            [...contactsList.children].forEach((r, i) => {
                r.querySelector('.contact-label').textContent = `担当者 ${i + 1}`;
            });
            if (wasPrimary && contactsList.children.length > 0) {
                contactsList.children[0].querySelector('input[type=radio]').checked = true;
            }
        });
        contactsList.appendChild(row);
    }

    addContactBtn?.addEventListener('click', () => addContactRow({ is_primary: false }));

    cancelBtn?.addEventListener('click', async () => {
        const accepted = await window.cidmAdminUi.showConfirm('入力内容を破棄して戻りますか？', { confirmText: '戻る' });
        if (!accepted) return;
        window.history.back();
    });

    document.addEventListener('DOMContentLoaded', async () => {
        await window.cidmAdminAuth.ensureAuthenticated(supabaseClient, 'admin.html');
        if (!memberId) {
            window.cidmAdminUi.showToast('IDが指定されていません。', 'error', 3000);
            form.style.display = 'none';
            return;
        }

        const { data, error } = await supabaseClient.from('member').select('*').eq('id', memberId).single();
        if (error || !data) {
            window.cidmAdminUi.showToast('データ取得に失敗しました。', 'error', 3000);
            form.style.display = 'none';
            return;
        }

        form.member_type.value = data.member_type || '';
        if (officerCheckbox) officerCheckbox.checked = Boolean(data.is_officer) || data.member_type === '役員';
        form.division_flag.value = data.division_flag || '会員';
        updateLoginSectionByDivision(form.division_flag.value);
        form.cidm_role.value = data.cidm_role || '';
        form.company_name.value = data.company_name || '';
        form.department.value = data.department || '';
        form.job_title.value = data.job_title || '';
        form.representative_name.value = data.representative_name || '';
        form.zip_code.value = data.zip_code || '';
        form.address.value = data.address || '';
        form.phone_number.value = data.phone_number || '';
        form.fax_number.value = data.fax_number || '';
        form.email.value = data.email || '';
        form.biko.value = data.biko || '';

        const { data: contactData } = await supabaseClient
            .from('member_contacts')
            .select('id, name, phone, email, receive_invite_mail, receive_invoice_mail, is_primary, sort_order')
            .eq('member_id', memberId)
            .order('sort_order', { ascending: true });

        contactsList.innerHTML = '';
        if (Array.isArray(contactData) && contactData.length > 0) {
            contactData.forEach(c => addContactRow(c));
        } else {
            addContactRow({
                name: data.staff_name || '',
                phone: data.staff_mobile || '',
                email: data.staff_email || '',
                receive_invite_mail: true,
                receive_invoice_mail: true,
                is_primary: true
            });
        }

        if (!form.querySelector('input[name=primary_contact]:checked') && contactsList.children.length > 0) {
            contactsList.children[0].querySelector('input[name=primary_contact]').checked = true;
        }

        // 担当者ログイン設定を表示
        await renderStaffLoginSettings();

        const { data: loginSettings, error: loginSettingsError } = await supabaseClient.rpc('cidm_get_member_login_settings', {
            p_member_id: memberId
        });
        if (!loginSettingsError && Array.isArray(loginSettings) && loginSettings[0]) {
            renderPasswordStatus(loginSettings[0]);
        } else {
            if (loginSettingsError && String(loginSettingsError.message || '').includes('admin access required')) {
                loginRpcAvailable = false;
                passwordStatus.textContent = '認証バイパス中のためログイン情報は更新できません。';
                memberPasswordInput.disabled = true;
                memberPasswordToggle.disabled = true;
                memberPasswordToggle.style.opacity = '0.55';
                memberPasswordToggle.style.cursor = 'default';
            }
            renderPasswordStatus(null);
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        await window.cidmAdminUi.runWithButtonBusy(submitBtn, async () => {
            const ok = await window.cidmAdminAuth.ensureAuthenticated(supabaseClient, 'admin.html');
            if (!ok || !memberId) return;

            const contactRows = [...contactsList.querySelectorAll('.contact-row')];
            const primaryIdxVal = parseInt(form.querySelector('input[name=primary_contact]:checked')?.value ?? '-1', 10);
            const contacts = contactRows.map((row, i) => ({
                name: row.querySelector('input[name="contact_name[]"]').value.trim() || null,
                phone: row.querySelector('input[name="contact_phone[]"]').value.trim() || null,
                email: row.querySelector('input[name="contact_email[]"]').value.trim() || null,
                receive_invite_mail: row.querySelector('input[name="contact_receive_invite[]"]')?.checked !== false,
                receive_invoice_mail: row.querySelector('input[name="contact_receive_invoice[]"]')?.checked !== false,
                is_primary: parseInt(row.dataset.idx, 10) === primaryIdxVal,
                sort_order: i
            })).filter(c => c.name || c.phone || c.email);

            if (contacts.length === 0) {
                window.cidmAdminUi.showToast('担当者を1名以上入力してください。', 'error', 2600);
                return;
            }

            const primaryContact = contacts.find(c => c.is_primary) || contacts[0];
            const email = form.email.value.trim();
            const memberPassword = form.member_password.value.trim();

            const updateData = {
                division_flag: form.division_flag.value || '会員',
                member_type: form.member_type.value || null,
                is_officer: Boolean(officerCheckbox?.checked),
                cidm_role: form.cidm_role.value.trim() || null,
                company_name: form.company_name.value.trim(),
                department: form.department.value.trim() || null,
                job_title: form.job_title.value.trim() || null,
                representative_name: form.representative_name.value.trim(),
                zip_code: form.zip_code.value.trim(),
                address: form.address.value.trim(),
                phone_number: form.phone_number.value.trim(),
                fax_number: form.fax_number.value.trim() || null,
                email: email,
                staff_name: primaryContact.name,
                staff_mobile: primaryContact.phone,
                staff_email: primaryContact.email,
                biko: form.biko.value.trim()
            };

            if (!updateData.company_name || !updateData.representative_name || !email) {
                window.cidmAdminUi.showToast('必須項目を入力してください。', 'error', 2200);
                return;
            }
            if (memberPassword && memberPassword.length < 8) {
                window.cidmAdminUi.showToast('パスワードは8文字以上で入力してください。', 'error', 2600);
                return;
            }

            const { error } = await supabaseClient.from('member').update(updateData).eq('id', memberId);
            if (error) {
                window.cidmAdminUi.showToast('更新に失敗しました: ' + error.message, 'error', 3000);
                return;
            }

            let updatedLoginSettings = null;
            const shouldUpdateLogin = loginRpcAvailable && !!memberPassword;
            if (!loginRpcAvailable && !!memberPassword) {
                window.cidmAdminUi.showToast('認証バイパス中のためログイン情報の更新はスキップしました。', 'info', 2800);
            }
            if (shouldUpdateLogin) {
                const { data: loginData, error: loginError } = await supabaseClient.rpc('cidm_admin_set_member_login', {
                    p_member_id: memberId,
                    p_login_id: email,
                    p_password: memberPassword || null
                });
                if (loginError) {
                    window.cidmAdminUi.showToast('基本情報は更新しましたが、ログイン情報の更新に失敗しました: ' + loginError.message, 'error', 4200);
                    return;
                }
                updatedLoginSettings = loginData;
            }

            let canSyncContacts = true;
            const { error: delError } = await supabaseClient.from('member_contacts').delete().eq('member_id', memberId);
            if (delError) {
                if (isRlsPolicyError(delError)) {
                    canSyncContacts = false;
                    window.cidmAdminUi.showToast('認証バイパス中のため担当者テーブル同期はスキップしました。', 'info', 2800);
                } else {
                    window.cidmAdminUi.showToast('担当者情報の更新準備に失敗しました: ' + delError.message, 'error', 3600);
                    return;
                }
            }

            if (canSyncContacts) {
                const payload = contacts.map(c => ({ ...c, member_id: memberId }));
                const { error: insError } = await supabaseClient.from('member_contacts').insert(payload);
                if (insError) {
                    if (isRlsPolicyError(insError)) {
                        window.cidmAdminUi.showToast('認証バイパス中のため担当者テーブル同期はスキップしました。', 'info', 2800);
                    } else {
                        window.cidmAdminUi.showToast('担当者情報の更新に失敗しました: ' + insError.message, 'error', 3600);
                        return;
                    }
                }
            }

            if (Array.isArray(updatedLoginSettings) && updatedLoginSettings[0]) {
                renderPasswordStatus(updatedLoginSettings[0]);
            }

            if (memberPassword) {
                try {
                    if (window.cidmAdminMail?.sendMemberLoginMail) {
                        await window.cidmAdminMail.sendMemberLoginMail({
                            email: email,
                            login_id: email,
                            password: memberPassword,
                            member_name: form.representative_name.value.trim(),
                            company_name: form.company_name.value.trim(),
                            login_url: new URL('index.html', window.location.href).href
                        });
                        window.cidmAdminUi.showToast('初期ログイン情報のメールを送信しました。', 'success', 1600);
                    }
                } catch (mailError) {
                    window.cidmAdminUi.showToast('更新は完了しましたが、初期ログイン情報のメール送信に失敗しました: ' + (mailError?.message || 'unknown error'), 'error', 4200);
                }
            }

            form.member_password.value = '';
            window.cidmAdminUi.showToast('更新が完了しました。', 'success', 900);
            setTimeout(() => { window.location.href = `admin-members.html?id=${memberId}`; }, 500);
        }, '更新中...');
    });

    // ============================================================
    // 担当者ログイン設定機能
    // ============================================================
    async function renderStaffLoginSettings() {
        const section = document.getElementById('staff-login-section');
        const listContainer = document.getElementById('staff-login-list');
        if (!section || !listContainer) return;

        // contactsListから各contactのデータを取得
        const contactRows = contactsList.querySelectorAll('.contact-row');
        if (contactRows.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        listContainer.innerHTML = '';

        for (const row of contactRows) {
            const contactNameEl = row.querySelector('.contact-label');
            const contactNameInput = row.querySelector('input[name="contact_name[]"]');
            const contactPhoneInput = row.querySelector('input[name="contact_phone[]"]');
            const contactEmailInput = row.querySelector('input[name="contact_email[]"]');
            
            const contactName = contactNameInput?.value?.trim() || contactNameEl?.textContent?.trim() || '';
            const contactEmail = contactEmailInput?.value?.trim() || '';
            
            if (!contactEmail) continue; // メールアドレスがない場合はスキップ

            // このcontactのIDを取得（実は、新規追加時はIDが無いので注意が必要）
            // 既存の contact.id が有る場合は data属性に保存されているはず
            let contactId = row.dataset.contactId;
            
            // contactIdが無い場合は、フォーム送信時にDB側で作成されるため、新規行の場合は処理をスキップ
            if (!contactId || contactId === 'undefined') {
                continue;
            }

            const staffLoginDiv = document.createElement('div');
            staffLoginDiv.style.marginBottom = '1rem';
            staffLoginDiv.style.padding = '1rem';
            staffLoginDiv.style.border = '1px solid #e2e8f0';
            staffLoginDiv.style.borderRadius = '0.5rem';
            staffLoginDiv.style.backgroundColor = '#f8fafc';

            // 担当者のログイン設定を取得
            const { data: staffSettings, error: staffError } = await supabaseClient.rpc(
                'cidm_get_staff_login_settings',
                { p_contact_id: contactId }
            );

            const settings = staffError || !staffSettings || staffSettings.length === 0 ? null : staffSettings[0];
            const hasPassword = settings?.has_password || false;
            const loginId = settings?.login_id || contactEmail;
            const updatedAt = settings?.updated_at ? new Date(settings.updated_at).toLocaleString('ja-JP') : '';

            staffLoginDiv.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">
                    <div style="flex:1;">
                        <div style="font-weight:700;margin-bottom:0.3rem;">${window.cidmAdminUi.sanitizeText(contactName)}</div>
                        <div style="font-size:0.85rem;color:#64748b;">${window.cidmAdminUi.sanitizeText(contactEmail)}</div>
                    </div>
                    <div style="text-align:right;font-size:0.78rem;">
                        <div style="color:${hasPassword ? '#16a34a' : '#ef4444'};font-weight:600;">
                            ${hasPassword ? '<i class="fa-solid fa-check"></i> 設定済み' : '未設定'}
                        </div>
                        ${updatedAt ? `<div style="color:#94a3b8;margin-top:0.2rem;font-size:0.75rem;">最終: ${updatedAt}</div>` : ''}
                    </div>
                </div>
                <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                    <button type="button" class="staff-update-btn btn btn-submit" style="flex:1;min-width:150px;font-size:0.78rem;padding:0.5rem 0.75rem;background:#3b82f6;" data-contact-id="${contactId}" data-contact-email="${window.cidmAdminUi.sanitizeText(contactEmail)}" data-contact-name="${window.cidmAdminUi.sanitizeText(contactName)}">
                        <i class="fa-solid fa-key"></i> パスワード設定
                    </button>
                    ${hasPassword ? `<button type="button" class="staff-resend-btn btn btn-submit" style="flex:1;min-width:150px;font-size:0.78rem;padding:0.5rem 0.75rem;background:#8b5cf6;" data-contact-id="${contactId}" data-contact-email="${window.cidmAdminUi.sanitizeText(contactEmail)}" data-contact-name="${window.cidmAdminUi.sanitizeText(contactName)}">
                        <i class="fa-solid fa-paper-plane"></i> メール再送
                    </button>` : ''}
                </div>
            `;

            listContainer.appendChild(staffLoginDiv);
        }

        // ボタンのイベントリスナーを追加
        document.querySelectorAll('.staff-update-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                const contactId = btn.dataset.contactId;
                const contactEmail = btn.dataset.contactEmail;
                const contactName = btn.dataset.contactName;

                // パスワード入力ダイアログ
                const newPassword = prompt('新しいパスワードを入力してください（8文字以上）:');
                if (!newPassword) return;
                
                if (newPassword.length < 8) {
                    window.cidmAdminUi.showToast('パスワードは8文字以上で設定してください。', 'error', 2200);
                    return;
                }

                await window.cidmAdminUi.runWithButtonBusy(btn, async () => {
                    const { error } = await supabaseClient.rpc('cidm_admin_set_staff_login', {
                        p_contact_id: contactId,
                        p_login_id: contactEmail,
                        p_password: newPassword
                    });

                    if (error) {
                        throw new Error(error.message || 'パスワード設定に失敗しました');
                    }

                    // メール送信
                    const mailResult = await window.cidmAdminStaffLogin.sendStaffLoginMail({
                        staff_email: contactEmail,
                        staff_name: contactName,
                        company_name: form.company_name.value.trim(),
                        login_id: contactEmail,
                        password: newPassword,
                        login_url: new URL('index.html', window.location.href).href
                    });

                    if (!mailResult.ok) {
                        window.cidmAdminUi.showToast('パスワードは設定しましたが、メール送信に失敗しました: ' + (mailResult.error || 'unknown'), 'error', 3200);
                        return;
                    }

                    window.cidmAdminUi.showToast('パスワードを設定し、メールを送信しました。', 'success', 2200);
                    await renderStaffLoginSettings();
                }, '設定中...');
            });
        });

        document.querySelectorAll('.staff-resend-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                const contactId = btn.dataset.contactId;
                const contactEmail = btn.dataset.contactEmail;
                const contactName = btn.dataset.contactName;

                await window.cidmAdminUi.runWithButtonBusy(btn, async () => {
                    const tempPassword = window.cidmAdminStaffLogin.generateTemporaryPassword(12);

                    // パスワードを更新
                    const { error: pwError } = await supabaseClient.rpc('cidm_admin_set_staff_login', {
                        p_contact_id: contactId,
                        p_login_id: contactEmail,
                        p_password: tempPassword
                    });

                    if (pwError) {
                        throw new Error(pwError.message || 'パスワード更新に失敗しました');
                    }

                    // メール送信
                    const mailResult = await window.cidmAdminStaffLogin.sendStaffLoginMail({
                        staff_email: contactEmail,
                        staff_name: contactName,
                        company_name: form.company_name.value.trim(),
                        login_id: contactEmail,
                        password: tempPassword,
                        login_url: new URL('index.html', window.location.href).href
                    });

                    if (!mailResult.ok) {
                        throw new Error(mailResult.error || 'メール送信に失敗しました');
                    }

                    window.cidmAdminUi.showToast('一時パスワードをメールで送信しました。', 'success', 2200);
                    await renderStaffLoginSettings();
                }, '送信中...');
            });
        });
    }
